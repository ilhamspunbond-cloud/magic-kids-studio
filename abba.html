<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dasbor Abba</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#eef3ff;color:#223}header{background:#4361ee;color:#fff;padding:10px;font-weight:700;text-align:center}
.box{background:#fff;margin:8px;padding:10px;border-radius:14px}button,input{font-size:15px;border:0;border-radius:10px;padding:8px 10px;margin:3px;background:#dfe6ff}.g{display:flex;flex-wrap:wrap;gap:8px}.it{width:110px;text-align:center;font-size:12px}.it img{width:100%;border-radius:8px}</style></head><body>
<header>👨‍👧 Dasbor Abba · Shanum Hiyannuryah</header>
<div class="box"><b>Kode keluarga:</b> <input id="fam" size="10"><button id="sf">Simpan</button> <span id="st" style="font-size:12px"></span></div>
<div class="box"><b>📊 Penilaian &amp; riwayat gambar</b> <div id="sum" style="margin:6px 0"></div><div class="g" id="h"></div>
<small>Penilaian saat ini otomatis sederhana (kelengkapan warna dan coretan). Menulis &amp; membaca belum ada.</small></div>
<div class="box"><b>📖 Nilai belajar (ngaji, doa, hitung, menulis)</b><div id="bj"></div></div>
<div class="box"><b>🎁 Kirim ke Shanum (real time)</b><br>
<label><button onclick="this.nextElementSibling.click()">🖼 Kirim gambar</button><input id="fi" type="file" accept="image/*" hidden></label>
<label><button onclick="this.nextElementSibling.click()">🎵 Kirim lagu (maks ±700 KB)</button><input id="fs" type="file" accept="audio/*" hidden></label></div>
<div class="box"><b>💬 Pesan</b><div><input id="ci" placeholder="Tulis pesan untuk Shanum..." style="width:70%"><button id="cs">Kirim</button></div><div id="cl"></div></div>
<script type="module">
import * as C from './cloud.js';const $=s=>document.querySelector(s);
$('#fam').value=C.getFam();$('#sf').onclick=()=>C.setFam($('#fam').value);$('#st').textContent=C.online?'🟢 Online':'🟡 Mode lokal (isi firebase-config.js)';
C.sub('hist',l=>{const av=l.length?Math.round(l.reduce((a,b)=>a+b.score,0)/l.length):0;$('#sum').textContent=l.length?`Rata-rata nilai: ${av} dari ${l.length} gambar terakhir`:'Belum ada gambar';
$('#h').innerHTML=l.map(x=>`<div class="it"><img src="${x.thumb}"><div>⭐ ${x.score} · ${x.mv}</div><div>${new Date(x.t).toLocaleString('id-ID')}</div></div>`).join('')});
C.sub('chat',l=>$('#cl').innerHTML=l.slice(0,8).map(m=>`<div><b>${m.from}:</b> ${String(m.text).replace(/</g,'&lt;')}</div>`).join(''));
C.sub('belajar',l=>$('#bj').innerHTML=l.slice(0,12).map(x=>`<div>${x.nilai>=75?'🌟':'📝'} <b>${x.jenis}</b> · nilai ${x.nilai} · ${new Date(x.t).toLocaleString('id-ID')}</div>`).join('')||'Belum ada');
$('#cs').onclick=()=>{const v=$('#ci').value.trim();if(v){C.add('chat',{from:'Abba',text:v});$('#ci').value=''}};
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);C.add('media',{kind:'img',name:f.name,data:c.toDataURL('image/jpeg',.7)});alert('Gambar terkirim ✔')};i.src=URL.createObjectURL(f)};
$('#fs').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>700000)return alert('Lagu terlalu besar (maks ±700 KB). Potong/kompres dulu.');const r=new FileReader();r.onload=()=>{C.add('media',{kind:'song',name:f.name,data:r.result});alert('Lagu terkirim ✔')};r.readAsDataURL(f)};
</script></body></html>
