<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Belajar bersama Shanum</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:system-ui,sans-serif;background:#effaf3;color:#234;text-align:center}
header{background:linear-gradient(90deg,#2a9d5c,#4cc3d9);color:#fff;padding:8px;font-weight:700}header a{color:#fff}
button{font-size:15px;border:0;border-radius:12px;padding:9px 12px;margin:3px;background:#c9f0d8}.big{background:#2a9d5c;color:#fff;font-weight:700}
#ar{font-size:34px;line-height:1.9;margin:12px 8px 0;font-family:'Amiri','Noto Naskh Arabic',serif}#lt{font-size:15px;color:#567}#msg{margin:10px;font-size:17px;min-height:50px;font-weight:600}
canvas{touch-action:none;background:#fff;border:3px solid #2a9d5c;border-radius:14px}
</style></head><body>
<header>📖 Belajar bersama Shanum · <a href="index.html">🎨 Menggambar</a></header>
<div id="menu"></div>
<div id="pl" hidden><button id="stop">⏹ Berhenti</button>
<div id="ar" dir="rtl"></div><div id="lt"></div><div id="msg"></div>
<canvas id="wc" width="300" height="300" hidden></canvas><div><button class="big" id="ok" hidden>✔ Selesai menulis</button><button id="rs" hidden>🧽 Ulangi</button></div></div>
<p style="font-size:12px;color:#678;margin:14px">Pakai Chrome di Android (izinkan mikrofon). Suara guru memakai suara bawaan HP. Bacaan sebaiknya tetap dicek guru ngaji.</p>
<script type="module">
import*as C from './cloud.js';
const $=s=>document.querySelector(s);
const L={
ikhlas:{n:'Surat Al-Ikhlas',v:[['قُلْ هُوَ اللَّهُ أَحَدٌ','Qul huwallahu ahad'],['اللَّهُ الصَّمَدُ','Allahush shamad'],['لَمْ يَلِدْ وَلَمْ يُولَدْ','Lam yalid wa lam yulad'],['وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ','Wa lam yakul lahu kufuwan ahad']]},
kautsar:{n:'Surat Al-Kautsar',v:[['إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ','Inna a\'thainakal kautsar'],['فَصَلِّ لِرَبِّكَ وَانْحَرْ','Fashalli lirabbika wanhar'],['إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ','Inna syani\'aka huwal abtar']]},
falaq:{n:'Surat Al-Falaq',v:[['قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ','Qul a\'udzu birabbil falaq'],['مِن شَرِّ مَا خَلَقَ','Min syarri ma khalaq'],['وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ','Wa min syarri ghasiqin idza waqab'],['وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ','Wa min syarrin naffatsati fil \'uqad'],['وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ','Wa min syarri hasidin idza hasad']]},
nas:{n:'Surat An-Nas',v:[['قُلْ أَعُوذُ بِرَبِّ النَّاسِ','Qul a\'udzu birabbin nas'],['مَلِكِ النَّاسِ','Malikin nas'],['إِلَهِ النَّاسِ','Ilahin nas'],['مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ','Min syarril waswasil khannas'],['الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ','Alladzi yuwaswisu fi shudurin nas'],['مِنَ الْجِنَّةِ وَالنَّاسِ','Minal jinnati wannas']]},
makan:{n:'Doa sebelum makan',v:[['اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ','Allahumma barik lana fima razaqtana wa qina \'adzaban nar']]},
tidur:{n:'Doa sebelum tidur',v:[['بِاسْمِكَ اللَّهُمَّ أَحْيَا وَبِاسْمِكَ أَمُوتُ','Bismikallahumma ahya wa bismika amut']]},
ortu:{n:'Doa untuk orang tua',v:[['رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا','Rabbighfirli waliwalidayya warhamhuma kama rabbayani shaghira']]}};
const HURUF=[['ا','Alif'],['ب','Ba'],['ت','Ta'],['ث','Tsa'],['ج','Jim'],['ح','Ha'],['خ','Kho'],['د','Dal'],['ر','Ro'],['س','Sin']];
const NUM={nol:0,satu:1,dua:2,tiga:3,empat:4,lima:5,enam:6,tujuh:7,delapan:8,sembilan:9,sepuluh:10};
let run=0;
const speak=(t,l='id-ID')=>new Promise(r=>{const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=.8;u.onend=u.onerror=r;speechSynthesis.cancel();speechSynthesis.speak(u)});
const listen=(l,ms=9000)=>new Promise(r=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return r(null);const x=new R;x.lang=l;x.maxAlternatives=3;let d=0;const fin=v=>{if(!d){d=1;try{x.stop()}catch(e){}r(v)}};
x.onresult=e=>fin([...e.results[0]].map(a=>a.transcript));x.onerror=()=>fin([]);x.onend=()=>fin([]);setTimeout(()=>fin([]),ms);try{x.start()}catch(e){fin(null)}});
const nz=s=>s.replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\u0621-\u064A ]/g,'').trim().split(/\s+/).filter(Boolean);
const lev=(a,b)=>{const d=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]};
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
function cek(exp,alts){const E=nz(exp);let best={s:0,ok:E.map(()=>false)};for(const t of alts){const H=nz(t),ok=E.map(w=>H.some(h=>sim(w,h)>=.7)),s=ok.filter(Boolean).length/E.length;if(s>=best.s)best={s,ok}}return best}
const hl=(a,ok)=>$('#ar').innerHTML=a.split(' ').map((w,i)=>`<span style="color:${ok[i]?'#2a9d5c':'#e63946'}">${w}</span>`).join(' ');
const msg=t=>$('#msg').textContent=t,fail='Browser ini belum bisa mendengar suara. Buka dengan Chrome di Android ya.';
function open(){run++;$('#menu').hidden=true;$('#pl').hidden=false;$('#wc').hidden=$('#ok').hidden=$('#rs').hidden=true;$('#ar').textContent=$('#lt').textContent=$('#msg').textContent='';return run}
function selesai(id,jenis,nilai){if(id!=run)return;C.add('belajar',{jenis,nilai,who:'Shanum'});msg(`Alhamdulillah, selesai! Nilai: ${nilai} ⭐`);speak(`Alhamdulillah, selesai! Nilai kamu ${nilai}`);$('#stop').textContent='⬅ Kembali'}
async function ngaji(k){const id=open(),les=L[k],sk=[];$('#stop').textContent='⏹ Berhenti';
for(const[a,l]of les.v){let best=0;$('#ar').textContent=a;$('#lt').textContent=l;
for(let t=0;t<3&&id==run&&best<.75;t++){msg('👂 Dengarkan guru...');await speak(a,'ar-SA');if(id!=run)return;msg('🗣 Giliran kamu, Shanum!');await speak('Giliran kamu, Sanum!');if(id!=run)return;msg('🎙 Mendengarkan...');
const alts=await listen('ar-SA');if(id!=run)return;if(alts===null)return msg(fail);if(!alts.length){await speak('Ayo, bacanya lebih keras ya');continue}
const r=cek(a,alts);hl(a,r.ok);best=Math.max(best,r.s);
if(r.s>=.75)await speak('Wah, hebat Sanum! Bacaanmu sudah tepat');else{msg('Hampir tepat. Yang merah belum pas, ayo coba lagi!');await speak('Hampir tepat. Dengarkan lagi ya, lalu coba lagi')}}
sk.push(best)}
selesai(id,les.n,Math.round(100*sk.reduce((a,b)=>a+b,0)/sk.length))}
async function hitung(){const id=open();$('#stop').textContent='⏹ Berhenti';let benar=0;
for(let i=0;i<5;i++){const a=1+Math.random()*8|0,p=Math.random()<.5,b=1+Math.random()*(p?10-a:a)|0,h=p?a+b:a-b;$('#ar').textContent=`${a} ${p?'+':'−'} ${b} = ?`;
await speak(`Berapa ${a} ${p?'tambah':'kurang'} ${b}?`);if(id!=run)return;msg('🗣 Giliran kamu, Shanum!');await speak('Giliran kamu, Sanum!');if(id!=run)return;msg('🎙 Mendengarkan...');
const alts=await listen('id-ID',7000);if(id!=run)return;if(alts===null)return msg(fail);
const got=alts.map(t=>{const m=t.match(/\d+/);return m?+m[0]:NUM[t.trim().toLowerCase()]});
if(got.includes(h)){benar++;msg('✅ Benar! Kamu hebat!');await speak('Benar! Kamu hebat, Sanum!')}else{msg(`Belum tepat. Jawabannya ${h}`);await speak(`Belum tepat. Jawabannya ${h}`)}}
selesai(id,'Berhitung',benar*20)}
const wc=$('#wc'),x=wc.getContext('2d'),sk=document.createElement('canvas');sk.width=sk.height=300;const sx=sk.getContext('2d');let hi,pd,lp;
const FONT='bold 230px "Amiri","Noto Naskh Arabic",serif';
function huruf(i){const id=open();hi=i;$('#stop').textContent='⬅ Kembali';$('#wc').hidden=$('#ok').hidden=$('#rs').hidden=false;$('#lt').textContent='Tulis huruf '+HURUF[i][1];sx.clearRect(0,0,300,300);rend();speak('Tulis huruf '+HURUF[i][1])}
function rend(){x.clearRect(0,0,300,300);x.font=FONT;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#d9d9d9';x.fillText(HURUF[hi][0],150,150);x.drawImage(sk,0,0)}
const pt=e=>{const r=wc.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*300/r.height]};
wc.onpointerdown=e=>{pd=1;lp=pt(e);wc.setPointerCapture(e.pointerId)};wc.onpointerup=()=>pd=0;
wc.onpointermove=e=>{if(!pd)return;const p=pt(e);sx.strokeStyle='#2a9d5c';sx.lineWidth=14;sx.lineCap='round';sx.beginPath();sx.moveTo(...lp);sx.lineTo(...p);sx.stroke();lp=p;rend()};
$('#rs').onclick=()=>{sx.clearRect(0,0,300,300);rend()};
$('#ok').onclick=async()=>{const t=document.createElement('canvas');t.width=t.height=300;const y=t.getContext('2d');y.font=FONT;y.textAlign='center';y.textBaseline='middle';y.fillText(HURUF[hi][0],150,150);const core=y.getImageData(0,0,300,300).data;
y.lineWidth=26;y.lineJoin='round';y.strokeText(HURUF[hi][0],150,150);const zone=y.getImageData(0,0,300,300).data,st=sx.getImageData(0,0,300,300).data;let tc=0,cc=0,sc=0,ins=0;
for(let i=3;i<core.length;i+=4){if(core[i]>128){tc++;if(st[i]>0)cc++}if(st[i]>0){sc++;if(zone[i]>0)ins++}}
if(!sc)return msg('Ayo tulis dulu ya ✏️');const n=Math.round(100*(.6*Math.min(1,cc/tc*1.3)+.4*ins/sc));
msg(n>=70?`Tulisanmu bagus! ⭐ Nilai ${n}`:`Hampir! Ikuti garis abu-abu ya. Nilai ${n}`);speak(n>=70?'Wah, tulisanmu bagus, Sanum!':'Hampir bagus. Coba ikuti garis abunya ya');C.add('belajar',{jenis:'Menulis huruf '+HURUF[hi][1],nilai:n,who:'Shanum'})};
$('#stop').onclick=()=>{run++;speechSynthesis.cancel();$('#pl').hidden=true;$('#menu').hidden=false};
const M=$('#menu');M.innerHTML='<h3>🕌 Ngaji &amp; Doa</h3>';
for(const k in L){const b=document.createElement('button');b.textContent=L[k].n;b.onclick=()=>ngaji(k);M.append(b)}
M.insertAdjacentHTML('beforeend','<h3>🔢 Berhitung</h3>');let b=document.createElement('button');b.textContent='Hitung bersama';b.onclick=hitung;M.append(b);
M.insertAdjacentHTML('beforeend','<h3>✍️ Menulis huruf hijaiyah</h3>');HURUF.forEach((h,i)=>{const e=document.createElement('button');e.textContent=h[0]+' '+h[1];e.onclick=()=>huruf(i);M.append(e)});
</script></body></html>
