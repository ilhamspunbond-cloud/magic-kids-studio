const TT={ngaji:'🕌 Ngaji &amp; Doa',baca:'📖 Membaca huruf hijaiyah',tulis:'✍️ Menulis huruf hijaiyah',hitung:'🔢 Berhitung',tebak:'🧠 Tebak &amp; Pilih'};M.innerHTML='<h3>'+(TT[H]||TT.ngaji)+'</h3>';
if(H=='baca'){mk('Level 1 · Huruf A sampai Z',()=>latih(ABC.map((n,i)=>[String.fromCharCode(65+i)+' '+String.fromCharCode(97+i),[n],n]),'Membaca huruf A-Z'));
mk('Level 2 · Suku kata',()=>latih(SUKU.slice().sort(()=>Math.random()-.5).slice(0,12).map(x=>[x,[x],x]),'Membaca suku kata'));
mk('Level 3 · Mengeja kata',()=>latih(KATA.slice().sort(()=>Math.random()-.5).slice(0,6).map(x=>{const p=x.split('-'),k=p.join('');return[p.join(' · '),p,k]}),'Mengeja kata'));
mk('Level 4 · Cocokkan gambar & kata',cocok)}
else if(H=='tulis')HURUF.forEach((h,i)=>mk(h[0]+' '+h[1],()=>huruf(i)));
else if(H=='hitung')mk('▶ Mulai hitung bersama',hitung);
else if(H=='tebak'){mk('🧩 Tebak-tebakan',()=>tebak(RID,'Tebak-tebakan'));mk('🌟 Pilih yang baik',()=>tebak(KAR,'Pilih yang baik'))}
else{for(const k in L)mk(L[k].n,()=>ngaji(k));M.insertAdjacentHTML('beforeend','<h3>🔤 Membaca huruf hijaiyah</h3>');HURUF.forEach((h,i)=>mk(h[0]+' '+h[1],()=>baca(i)));M.insertAdjacentHTML('beforeend','<h3>🎁 Pelajaran baru dari Abba</h3><div id="rl"></div>');
C.sub('lessons',l=>{$('#rl').innerHTML=l.length?'':'Belum ada';l.forEach(d=>{L['r'+d.id]={n:d.n,v:d.v};const e=document.createElement('button');e.textContent=d.n;e.onclick=()=>ngaji('r'+d.id);$('#rl').append(e)})})}
addEventListener('hashchange',()=>location.reload());
</script></body></html>
