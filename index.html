<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Magic Kids Studio</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><meta name="theme-color" content="#ff6fa5">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:linear-gradient(180deg,#ffe3f0,#e6f4ff 60%,#eafff3);text-align:center;color:#3b2a4a;overflow-x:hidden}
.top{padding:22px 16px 6px}.top img{width:92px;height:92px;border-radius:26px;box-shadow:0 8px 22px #ff6fa588;animation:pop 1.2s ease}
h1{margin:8px 0 0;font-size:26px;background:linear-gradient(90deg,#ff6fa5,#7b6cf6);-webkit-background-clip:text;color:transparent}.sub{color:#7a6a8a;font-size:14px;margin-top:2px}
#hi{font-size:19px;font-weight:700;margin:14px 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:440px;margin:10px auto;padding:10px 18px}
a.t{display:block;text-decoration:none;color:#fff;border-radius:24px;padding:22px 8px;font-weight:800;font-size:17px;box-shadow:0 8px 18px #0002;transition:.2s}a.t:active{transform:scale(.94)}
a.t span{display:block;font-size:46px;margin-bottom:6px;animation:bob 3s ease-in-out infinite}a.t small{display:block;font-weight:500;font-size:12px;opacity:.9}
.t1{background:linear-gradient(135deg,#2a9d5c,#6bd49a)}.t2{background:linear-gradient(135deg,#4361ee,#6fa8ff)}.t3{background:linear-gradient(135deg,#9b5de5,#d28bff)}.t4{background:linear-gradient(135deg,#ff6fa5,#ffb36b)}.t5{grid-column:1/3;background:linear-gradient(135deg,#ff9f1c,#ffd84d)}
.mas{position:fixed;font-size:34px;opacity:.85;animation:fl 6s ease-in-out infinite;pointer-events:none}
.ft{margin:12px}.ft button,.ft a{font-size:14px;border:0;border-radius:14px;padding:9px 14px;margin:4px;background:#fff;color:#555;text-decoration:none;box-shadow:0 3px 8px #0001}
#set{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:5}#set div{background:#fff;border-radius:20px;padding:18px;width:300px;text-align:left}#set input{width:100%;font-size:16px;padding:9px;margin:4px 0 10px;border:2px solid #ffd6e7;border-radius:10px}
@keyframes bob{50%{transform:translateY(-5px) rotate(4deg)}}@keyframes pop{from{transform:scale(.3);opacity:0}}@keyframes fl{50%{transform:translateY(-22px) rotate(10deg)}}
</style></head><body>
<span class="mas" style="left:6%;top:30%">🐱</span><span class="mas" style="right:5%;top:24%;animation-delay:1s">🐰</span><span class="mas" style="left:4%;bottom:12%;animation-delay:2s">🐻</span><span class="mas" style="right:6%;bottom:10%;animation-delay:3s">🦋</span>
<div class="top"><img src="logo.svg" alt="logo"><h1>Magic Kids Studio</h1><div class="sub">Belajar, berkreasi, dan bermain</div></div>
<div id="hi"></div>
<div class="grid">
<a class="t t1" href="belajar.html#ngaji"><span>🕌</span>Mengaji &amp; Doa<small>Surat pendek, doa harian</small></a>
<a class="t t2" href="belajar.html#baca"><span>📖</span>Membaca<small>Huruf hijaiyah</small></a>
<a class="t t3" href="belajar.html#tulis"><span>✍️</span>Menulis<small>Ikuti garis huruf</small></a>
<a class="t t4" href="gambar.html"><span>🎨</span>Menggambar<small>Warnai &amp; gerakkan</small></a>
<a class="t t5" href="belajar.html#hitung"><span>🔢</span>Berhitung<small>Tambah &amp; kurang</small></a>
</div>
<div class="ft"><button onclick="set.hidden=false">⚙️ Pengaturan</button><a href="abba.html">👨 Dasbor Abba</a></div>
<div id="set" hidden><div><b>⚙️ Pengaturan</b><br><br>Nama anak<input id="nm"><span style="font-size:12px;color:#777">Kode keluarga (samakan dengan HP Abba)</span><input id="fm"><button style="padding:10px 16px;border:0;border-radius:12px;background:#ff6fa5;color:#fff" onclick="save()">Simpan</button> <button style="padding:10px 16px;border:0;border-radius:12px" onclick="set.hidden=true">Tutup</button></div></div>
<script>
const nama=localStorage.nama||'Shanum',jam=new Date().getHours();
hi.textContent=(jam<11?'Selamat pagi':jam<15?'Selamat siang':jam<18?'Selamat sore':'Selamat malam')+', '+nama+'! 👋';nm.value=nama;fm.value=localStorage.fam||'shanum';
function save(){localStorage.nama=nm.value.trim()||'Shanum';localStorage.fam=fm.value.trim()||'shanum';location.reload()}
</script></body></html>
