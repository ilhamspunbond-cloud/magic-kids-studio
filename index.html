<script type="module">
import * as C from './cloud.js';
const $=s=>document.querySelector(s),W=360,H=440,wc=$('#c'),sc=$('#s'),w=wc.getContext('2d',{willReadFrequently:true}),g=sc.getContext('2d');

air:['🌊 Air','w'],pohon:['🌳 Pohon','t'],awan:['☁️ Awan','a'],hop:['🐇 Hewan melompat','l'],jalan:['🐕 Hewan jalan','l'],renang:['🐟 Berenang','s'],ubur:['🪼 Ubur-ubur','s'],kepiting:['🦀 Kepiting','s']};
for(const k in MOVES)['#mv','#mv2'].forEach(i=>$(i).add(new Option(MOVES[k][0],k)));
let tool='pen',col='#ff4d6d',pd=false,lp,strokes=0,sprites=[],sel=-1,playing=true,clk=0,rip=[],drag=false,off=[0,0];

function fill(x,y){x|=0;y|=0;const d=w.getImageData(0,0,W,H),p=d.data,i0=(y*W+x)*4,tr=p[i0],tg=p[i0+1],tb=p[i0+2];if(tr+tg+tb<300)return;const[fr,fg,fb]=rgb(col);if(Math.abs(tr-fr)+Math.abs(tg-fg)+Math.abs(tb-fb)<10)return;

w.putImageData(d,0,0);strokes++}
wc.onpointerdown=e=>{const[x,y]=pos(e,wc);if(tool=='fill')return fill(x,y);pd=true;lp=[x,y];wc.setPointerCapture(e.pointerId);strokes++;w.beginPath();w.arc(x,y,2,0,7);w.fillStyle=tool=='er'?'#fff':col;w.fill()};
wc.onpointermove=e=>{if(!pd)return;const[x,y]=pos(e,wc);w.lineCap='round';w.lineWidth=tool=='er'?20:5;w.strokeStyle=tool=='er'?'#fff':col;w.beginPath();w.moveTo(...lp);w.lineTo(x,y);w.stroke();lp=[x,y]};
wc.onpointerup=()=>pd=false;
const TPL={orang:()=>{S(()=>w.arc(180,100,38,0,7));S(()=>w.rect(150,140,60,110));S(()=>w.rect(100,142,50,26));S(()=>w.rect(210,142,50,26));S(()=>w.rect(150,250,28,90));S(()=>w.rect(182,250,28,90))},
ikan:()=>{S(()=>w.ellipse(180,200,90,50,0,0,7));S(()=>{w.moveTo(262,200);w.lineTo(325,150);w.lineTo(325,250);w.closePath()});S(()=>w.arc(135,185,6,0,7))},
pohon:()=>{S(()=>w.rect(165,250,30,110));S(()=>w.arc(180,190,80,0,7))}};
function S(f){w.beginPath();w.strokeStyle='#000';w.lineWidth=4;f();w.stroke()}
$('#tpl').onchange=e=>{if(!e.target.value)return;clr();TPL[e.target.value]();$('#mv').value={orang:'menari',ikan:'renang',pohon:'pohon'}[e.target.value];e.target.value=''};
function lineArt(img){const t=document.createElement('canvas');t.width=W;t.height=H;const x=t.getContext('2d'),s=Math.min(W/img.width,H/img.height);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(img,(W-img.width*s)/2,(H-img.height*s)/2,img.width*s,img.height*s);
const p=x.getImageData(0,0,W,H).data,o=w.createImageData(W,H),q=o.data;q.fill(255);const L=i=>p[i]*.3+p[i+1]*.59+p[i+2]*.11;
for(let y=0;y<H-1;y++)for(let xx=0;xx<W-1;xx++){const i=(y*W+xx)*4,e=Math.abs(L(i)-L(i+4))+Math.abs(L(i)-L(i+W*4));if(e>26){q[i]=q[i+1]=q[i+2]=0}}w.putImageData(o,0,0);strokes=0;toast('Gambar jadi garis! Ayo diwarnai 🎨')}
const loadImg=src=>{const i=new Image();i.onload=()=>lineArt(i);i.src=src};
$('#up').onchange=e=>{const f=e.target.files[0];if(f)loadImg(URL.createObjectURL(f))};
$('#sg').onchange=e=>{const f=e.target.files[0];if(f){$('#mus').src=URL.createObjectURL(f);$('#mus').play()}};
function nilai(){const p=w.getImageData(0,0,W,H).data;let c=0,hs=new Set;for(let i=0;i<p.length;i+=16){const r=p[i],gg=p[i+1],b=p[i+2];if(Math.max(r,gg,b)-Math.min(r,gg,b)>40){c++;hs.add((r>>6)+','+(gg>>6)+','+(b>>6))}}
return Math.min(100,Math.round(45+c/(W*H/4)*180+hs.size*3+Math.min(strokes,10)*1.5))}
function ding(){const a=ding.a||(ding.a=new AudioContext),n=a.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=a.createOscillator(),x=a.createGain();o.frequency.value=f;o.connect(x);x.connect(a.destination);x.gain.setValueAtTime(.2,n+i*.12);x.gain.exponentialRampToValueAtTime(.001,n+i*.12+.3);o.start(n+i*.12);o.stop(n+i*.12+.3)})}
function mode(m){wc.hidden=m!='d';sc.hidden=m=='d';$('#dm').hidden=m!='d';$('#sm').hidden=m=='d'}
$('#done').onclick=()=>{const d=w.getImageData(0,0,W,H),p=d.data;let x0=W,y0=H,x1=0,y1=0;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(p[i]>240&&p[i+1]>240&&p[i+2]>240)p[i+3]=0;else{if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
if(x1<x0)return toast('Gambar dulu ya, Shanum! ✏️');
const sc2=nilai(),t=document.createElement('canvas');t.width=W;t.height=H;t.getContext('2d').putImageData(d,0,0);
const bw=x1-x0+1,bh=y1-y0+1,k=Math.min(1,180/Math.max(bw,bh)),c=document.createElement('canvas');c.width=Math.max(4,bw*k|0);c.height=Math.max(4,bh*k|0);c.getContext('2d').drawImage(t,x0,y0,bw,bh,0,0,c.width,c.height);
const mv=$('#mv').value;sprites.push({img:c,w:c.width,h:c.height,x:50+Math.random()*260,y:MOVES[mv][1]=='s'||MOVES[mv][1]=='a'?120+Math.random()*150:300+Math.random()*30,mv,ph:Math.random()*6,dir:1});sel=sprites.length-1;$('#mv2').value=mv;
const th=document.createElement('canvas');th.width=120;th.height=147;th.getContext('2d').drawImage(wc,0,0,120,147);C.add('hist',{thumb:th.toDataURL('image/jpeg',.6),score:sc2,mv:MOVES[mv][0],who:'Shanum'});
mode('s');ding();toast((sc2>=85?'Luar biasa! ⭐⭐⭐ ':sc2>=65?'Keren! ⭐⭐ ':'Ayo tambah warna! ⭐ ')+'Nilai '+sc2)};
$('#nw').onclick=()=>{clr();mode('d')};$('#pp').onclick=e=>{playing=!playing;e.target.textContent=playing?'⏸':'▶️'};
$('#del').onclick=()=>{if(sel>=0)sprites.splice(sel,1);sel=-1};$('#mv2').onchange=e=>{if(sel>=0)sprites[sel].mv=e.target.value};
sc.onpointerdown=e=>{const[x,y]=pos(e,sc);sel=-1;for(let i=sprites.length-1;i>=0;i--){const s=sprites[i],cen=['s','a'].includes(MOVES[s.mv][1]),top=cen?s.y-s.h/2:s.y-s.h;if(Math.abs(x-s.x)<s.w/2&&y>top&&y<top+s.h){sel=i;drag=true;off=[s.x-x,s.y-y];$('#mv2').value=s.mv;sc.setPointerCapture(e.pointerId);break}}
if(sel<0)rip.push({x,y,t:performance.now()/1000})};
sc.onpointermove=e=>{const[x,y]=pos(e,sc);if(drag&&sel>=0){sprites[sel].x=x+off[0];sprites[sel].y=y+off[1]}else if(e.buttons&&document.body.classList.contains('wp'))rip.push({x,y,t:performance.now()/1000})};
sc.onpointerup=()=>drag=false;
window.wall=()=>{const on=document.body.classList.toggle('wp');sel=-1;if(on)document.documentElement.requestFullscreen?.().catch(()=>{});else if(document.fullscreenElement)document.exitFullscreen()};
function pose(s,T){const o={dx:0,dy:0,r:0,sx:1,sy:1,a:0,b:0,v:0},S=Math.sin,A=Math.abs;
switch(s.mv){
case'lari':o.v=70;o.dy=-A(S(T*10))*8;o.r=.08;o.a=S(T*10)*.9;o.b=S(T*10)*.9;break;
case'lompat':{const q=A(S(T*3));o.dy=-q*70;o.sy=1-(1-q)*.12;o.a=2*q;o.b=-2*q}break;
case'menari':o.r=S(T*5)*.2;o.dy=-A(S(T*5))*8;o.a=1+S(T*5)*.8;o.b=-(1+Math.cos(T*5)*.8);break;
case'tangan':o.a=T*7;o.b=-T*7;break;
case'layangan':o.a=.2;o.b=-1.1+S(T*3)*.4;o.r=-.04+S(T*3)*.04;break;
case'tali':o.dy=-Math.max(0,S(T*5))*28;o.a=.6+S(T*5)*.5;o.b=-o.a;break;
case'jongkok':{const q=(S(T*2)+1)/2;o.sy=1-q*.4;o.a=-q*.6;o.b=q*.6}break;
case'pohon':o.r=S(T*1.5)*.06;break;
case'awan':o.v=15;o.dy=S(T)*6;break;
case'hop':o.v=40;o.dy=-A(S(T*4))*45;o.r=S(T*4)*.1;break;
case'jalan':o.v=35;o.dy=-A(S(T*8))*4;o.r=S(T*8)*.05;break;
case'renang':o.v=50;o.dy=S(T*2)*15;o.r=S(T*4)*.15;break;
case'ubur':o.dy=S(T*2)*25;o.sy=1+S(T*4)*.12;o.sx=1-S(T*4)*.08;break;
case'kepiting':o.v=30;o.dx=S(T*8)*3;o.dy=-A(S(T*8))*3;break}
return o}
function dsp(s,o,T){const I=s.img,a=s.w,b=s.h,cat=MOVES[s.mv][1];
if(cat=='m'){const x1=.3*a|0,x2=.7*a|0,y1=.15*b|0,y2=.65*b|0;g.drawImage(I,x1,0,x2-x1,b,x1,0,x2-x1,b);
[[0,x1],[x2,a-x2]].forEach(([sx,sw])=>{g.drawImage(I,sx,0,sw,y1,sx,0,sw,y1);g.drawImage(I,sx,y2,sw,b-y2,sx,y2,sw,b-y2)});
[[0,x1,o.a,x1],[x2,a-x2,o.b,x2]].forEach(([sx,sw,ang,px])=>{const py=y1+.1*b;g.save();g.translate(px,py);g.rotate(ang);g.drawImage(I,sx,y1,sw,y2-y1,sx-px,y1-py,sw,y2-y1);g.restore()});
if(s.mv=='layangan'){g.strokeStyle='#555';g.lineWidth=1.5;g.beginPath();g.moveTo(a*.95,b*.3);g.lineTo(a*1.7,-b*.5);g.stroke();g.save();g.translate(a*1.7,-b*.5);g.rotate(.3+Math.sin(T*3)*.2);g.fillStyle='#ff4d6d';g.beginPath();g.moveTo(0,-22);g.lineTo(15,0);g.lineTo(0,26);g.lineTo(-15,0);g.fill();g.restore()}
if(s.mv=='tali'){g.strokeStyle='#8b5a2b';g.lineWidth=3;g.beginPath();const st=T*5;g.ellipse(a/2,b*.55,a*.85,b*.62,0,st,st+Math.PI*1.3);g.stroke()}}
else if(s.mv=='air'||s.mv=='renang'){const amp=s.mv=='air'?8:4;for(let y=0;y<b;y+=3)g.drawImage(I,0,y,a,3,Math.sin(y/7+T*4)*amp,y,a,3)}
else g.drawImage(I,0,0)}
function loop(ts){requestAnimationFrame(loop);if(sc.hidden)return;const t=ts/1000,dt=playing?Math.min(.05,t-(loop.p||t)):0;loop.p=t;clk+=dt;
const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#aee6ff');gr.addColorStop(.75,'#e8f8ff');g.fillStyle=gr;g.fillRect(0,0,W,H);
g.fillStyle='#ffd84d';g.beginPath();g.arc(300,55,28,0,7);g.fill();g.fillStyle='#8be08b';g.fillRect(0,335,W,H);g.fillStyle='#7ccbff';g.fillRect(0,395,W,H);

sprites.forEach((s,i)=>{const cat=MOVES[s.mv][1],T=clk+s.ph,o=pose(s,T),a=s.w,b=s.h;s.x+=o.v*s.dir*dt;if(s.x>W-a/2)s.dir=-1;if(s.x<a/2)s.dir=1;
g.save();if(bl>0)g.filter=`blur(${bl*3}px)`;g.translate(s.x+o.dx,s.y+o.dy);g.rotate(o.r);g.scale(o.sx*(o.v?s.dir:1),o.sy);g.translate(-a/2,cat=='s'||cat=='a'?-b/2:-b);dsp(s,o,T);

rip.forEach(r=>{const ag=t-r.t;g.strokeStyle=`rgba(255,255,255,${1-ag/1.5})`;g.lineWidth=3;g.beginPath();g.arc(r.x,r.y,ag*140,0,7);g.stroke();g.beginPath();g.arc(r.x,r.y,ag*90,0,7);g.stroke()})}
requestAnimationFrame(loop);
let chunks,rec;$('#rec').onclick=()=>{if(rec&&rec.state=='recording')return rec.stop();if(sc.hidden)return toast('Buat gerakan dulu ya');
